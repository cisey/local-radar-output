<style>
:root {
  --bg: #0b0f17;
  --card-bg: rgba(26, 32, 44, 0.7);
  --card-border: rgba(255, 255, 255, 0.08);
  --card-hover: rgba(36, 45, 62, 0.9);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --accent: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.25);
  --badge-food: rgba(249, 115, 22, 0.15);
  --badge-food-text: #fb923c;
  --badge-all: rgba(56, 189, 248, 0.15);
  --badge-all-text: #38bdf8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg);
  background-image:
    radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
  background-attachment: fixed;
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 60px;
}

.container { max-width: 580px; margin: 0 auto; padding: 24px 18px; }

/* Üst Navigasyon */
.top-nav { display: flex; align-items: center; margin-bottom: 24px; }
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--text-muted); text-decoration: none;
  font-size: 13.5px; font-weight: 500;
  background: rgba(255, 255, 255, 0.05);
  padding: 6px 14px; border-radius: 20px;
  border: 1px solid var(--card-border);
  backdrop-filter: blur(8px);
  transition: all 0.2s ease;
}
.back-btn:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.1); }

/* Başlık Alanı */
.header { margin-bottom: 24px; }
.radar-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 52px; height: 52px; border-radius: 16px;
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(99, 102, 241, 0.2));
  border: 1px solid rgba(56, 189, 248, 0.3);
  font-size: 26px; margin-bottom: 14px;
  box-shadow: 0 8px 20px var(--accent-glow);
}
h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; }
p.desc { color: var(--text-muted); font-size: 14.5px; margin-top: 6px; line-height: 1.5; }

/* Arama Kutusu */
.search-wrap { margin-bottom: 20px; }
.search-input {
  width: 100%;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 12px 16px;
  font-size: 14.5px;
  color: #fff;
  outline: none;
  backdrop-filter: blur(10px);
  transition: all 0.2s;
}
.search-input:focus {
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.search-input::placeholder { color: #64748b; }

/* İl Grupları */
.il-grup { margin-bottom: 28px; }
.il-baslik {
  font-size: 13px; font-weight: 800; color: var(--accent);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 12px; padding-left: 4px;
  display: flex; align-items: center; gap: 12px;
}
.il-baslik::after {
  content: ""; flex-grow: 1; height: 1px;
  background: linear-gradient(to right, var(--card-border), transparent);
}

/* Liste Kartları */
.list { display: flex; flex-direction: column; gap: 12px; }

.card {
  display: flex; align-items: center; gap: 16px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 18px; padding: 16px;
  text-decoration: none; color: inherit;
  backdrop-filter: blur(12px);
  transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  position: relative;
}
.card:hover { background: var(--card-hover); border-color: rgba(255, 255, 255, 0.16); }
.card:active { transform: scale(0.98); }

.card-icon {
  flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px;
  background: rgba(255, 255, 255, 0.04);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; border: 1px solid rgba(255, 255, 255, 0.06);
}

.card-info { flex-grow: 1; min-width: 0; }
.card-title {
  font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; }

.badge {
  display: inline-block; padding: 2px 8px; border-radius: 6px;
  font-weight: 600; font-size: 11px; letter-spacing: 0.02em;
}
.badge-food { background: var(--badge-food); color: var(--badge-food-text); }
.badge-all { background: var(--badge-all); color: var(--badge-all-text); }

.card-filename {
  color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.card-arrow {
  color: #64748b; font-size: 18px;
  transition: transform 0.2s, color 0.2s;
}
.card:hover .card-arrow { color: var(--accent); transform: translateX(3px); }

.state-msg { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px; }
</style>

    for (const [il, ilcelerStr] of Object.entries(ilIlceData)) {
      ilSozlugu.add(normalize(il));
      ilcelerStr.split(',').forEach(ilce => {
        ilceIlSozlugu[normalize(ilce)] = il;
      });
    }

    function dosyaAnaliz(dosyaAdi) {
      const ad = dosyaAdi.replace('.html', '');
      const isYemek = ad.toLowerCase().includes('yemek');
      const isHersey = ad.toLowerCase().includes('hersey') || ad.toLowerCase().includes('her-sey');

      let bolgeStr = ad.replace(/-(yemek|hersey|her-sey)$/i, '');
      let il = 'Diğer';
      const kelimeler = bolgeStr.split(/[-_ ]+/);
      
      for (let i = 0; i < kelimeler.length; i++) {
        let k = kelimeler[i];
        if (!k) continue;
        const normK = normalize(k);

        if (ilSozlugu.has(normK)) {
          il = k.replace(/\b\p{L}/gu, c => c.toLocaleUpperCase('tr'));
          break;
        } else if (normK === 'merkez' && i > 0) {
          const oncekiKelime = kelimeler[i - 1];
          if (ilSozlugu.has(normalize(oncekiKelime))) {
            il = oncekiKelime.replace(/\b\p{L}/gu, c => c.toLocaleUpperCase('tr'));
            break;
          }
        } else if (ilceIlSozlugu[normK]) {
          il = ilceIlSozlugu[normK];
          break;
        }
      }

      let temizIlce = bolgeStr.replace(/[-_]+/g, ' ').trim();
      let bolgeBaslik = temizIlce.replace(/\b\p{L}/gu, c => c.toLocaleUpperCase('tr'));
      let tip = isYemek ? 'Yemek & Mekan' : (isHersey ? 'Genel Rehber' : 'Rehber');
      let icon = isYemek ? '🍽️' : (isHersey ? '🧭' : '📍');
      let badgeClass = isYemek ? 'badge-food' : 'badge-all';

      return { baslik: bolgeBaslik, il: il, altBaslik: tip, icon: icon, badgeClass: badgeClass, dosya: dosyaAdi };
    }

    function kartCiz(liste) {
      container.innerHTML = '';
      if (!liste.length) {
        container.innerHTML = '<div class="state-msg">Eşleşen rehber bulunamadı.</div>';
        return;
      }

      const analizliListe = liste.map(item => dosyaAnaliz(item.name || item));
      const gruplar = {};
      
      analizliListe.forEach(info => {
        if (!gruplar[info.il]) gruplar[info.il] = [];
        gruplar[info.il].push(info);
      });

      const siraliIller = Object.keys(gruplar).sort((a, b) => {
        if (a === 'Diğer') return 1;
        if (b === 'Diğer') return -1;
        return a.localeCompare(b, 'tr');
      });

      siraliIller.forEach(il => {
        const ilDiv = document.createElement('div');
        ilDiv.className = 'il-grup';

        const ilBaslik = document.createElement('div');
        ilBaslik.className = 'il-baslik';
        ilBaslik.textContent = il;
        ilDiv.appendChild(ilBaslik);

        const listeDiv = document.createElement('div');
        listeDiv.className = 'list';

        const ilceler = gruplar[il].sort((a, b) => a.baslik.localeCompare(b.baslik, 'tr'));

        ilceler.forEach(info => {
          const a = document.createElement('a');
          a.className = 'card';
          a.href = info.dosya;
          a.innerHTML = `
            <div class="card-icon">${info.icon}</div>
            <div class="card-info">
              <div class="card-title">${info.baslik}</div>
              <div class="card-meta">
                <span class="badge ${info.badgeClass}">${info.altBaslik}</span>
                <span class="card-filename">${info.dosya}</span>
              </div>
            </div>
            <div class="card-arrow">→</div>
          `;
          listeDiv.appendChild(a);
        });

        ilDiv.appendChild(listeDiv);
        container.appendChild(ilDiv);
      });
    }

    // Arama fonksiyonu
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLocaleLowerCase('tr').trim();
      const filtrelenmis = tumRehberler.filter(item => {
        const ad = (item.name || item).toLocaleLowerCase('tr');
        return ad.includes(q);
      });
      kartCiz(filtrelenmis);
    });

    // GitHub API Çağrısı (Eksik olan parantezler düzeltildi)
    fetch(`https://api.github.com/repos/${KULLANICI}/${REPO}/contents`)
      .then(r => { if (!r.ok) throw 0; return r.json(); })
      .then(dosyalar => {
        tumRehberler = dosyalar.filter(f => f.name.endsWith('.html') && f.name !== 'index.html');
        kartCiz(tumRehberler);
      })
      .catch(() => {
        tumRehberler = [
          { name: 'Kilis-yemek.html' },
          { name: 'Kilis-merkez-yemek.html' },
          { name: 'Nizip-yemek.html' },
          { name: 'Karkamis-yemek.html' }
        ];
        kartCiz(tumRehberler);
      });
  </script>
</body>
